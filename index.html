<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Lichtszenen</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;width:100vw;height:100dvh;display:block;background:#000;outline:0}
#bar{position:fixed;left:50%;top:50%;width:min(280px,56vw);height:1px;transform:translate(-50%,-50%);background:rgba(255,255,255,.14);transition:opacity .5s}
#fill{height:100%;width:0;background:rgba(255,255,255,.85);transition:width .15s linear}
#message{position:fixed;left:24px;right:24px;top:55%;text-align:center;color:rgba(255,255,255,.7);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:none}
</style>
</head>
<body>
<canvas id="stage" tabindex="-1"></canvas>
<div id="bar"><div id="fill"></div></div>
<div id="message"></div>
<script>
(function () {
  var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var flavour = isMobile ? "mobile" : "desktop";
  var buildUrl = flavour + "/Build/" + flavour;
  var canvas = document.getElementById("stage");
  var bar = document.getElementById("bar");
  var fill = document.getElementById("fill");
  var message = document.getElementById("message");

  function showError(text) {
    bar.style.opacity = 0;
    message.textContent = text;
    message.style.display = "block";
  }

  var config = {
    dataUrl: buildUrl + ".data.unityweb",
    frameworkUrl: buildUrl + ".framework.js.unityweb",
    codeUrl: buildUrl + ".wasm.unityweb",
    streamingAssetsUrl: flavour + "/StreamingAssets",
    companyName: "Oleksandr Burdenko",
    productName: "Lichtszenen",
    productVersion: "1.0",
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2),
    showBanner: function (text, type) {
      if (type === "error") {
        showError("Die Demo konnte nicht gestartet werden. Bitte einen aktuellen Browser verwenden.");
        console.error(text);
      }
    }
  };

  var loader = document.createElement("script");
  loader.src = buildUrl + ".loader.js";
  loader.onerror = function () {
    showError("Die Demo konnte nicht geladen werden.");
  };
  loader.onload = function () {
    createUnityInstance(canvas, config, function (progress) {
      fill.style.width = Math.round(progress * 100) + "%";
    }).then(function (instance) {
      window.lichtszenen = instance;
      bar.style.opacity = 0;
      canvas.focus();
    }).catch(function (error) {
      showError("Die Demo konnte nicht gestartet werden. Bitte einen aktuellen Browser verwenden.");
      console.error(error);
    });
  };
  document.body.appendChild(loader);
})();
</script>
</body>
</html>
